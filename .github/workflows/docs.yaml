name: Documentation

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install apt-get libs
        run: |
          sudo apt-get update
          sudo apt-get -y install pandoc libopenmpi-dev
      - name: Setup Graphviz
        uses: ts-graphviz/setup-graphviz@v2.0.2
      - name: Make html Docs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.ref == 'refs/heads/main' && -1 || github.event.number }}
          GIT_COMMIT: ${{ github.sha }}
        run: |
          echo "Installing ARMI..."
          set -x
          pip install -U pip
          pip install -e .[memprof,mpi,test,docs]

          echo "Run unit tests..."
          pytest --junit-xml=test_results.xml -v -n 4 armi > pytest_verbose.log
          mpiexec -n 2 --use-hwthread-cpus pytest --junit-xml=test_results_mpi1.xml armi/tests/test_mpiFeatures.py > pytest_verbose_mpi1.log
          mpiexec -n 2 --use-hwthread-cpus pytest --junit-xml=test_results_mpi2.xml armi/tests/test_mpiParameters.py > pytest_verbose_mpi2.log
          mpiexec -n 2 --use-hwthread-cpus pytest --junit-xml=test_results_mpi3.xml armi/utils/tests/test_directoryChangersMpi.py > pytest_verbose_mpi3.log
          python doc/.static/cleanup_test_results.py test_results.xml

          echo "Git magic so the SCR will build on GitHub Actions..."
          git fetch --depth=2000

          echo "Build HTML docs..."
          cd doc
          git submodule init
          git submodule update
          make html
      - name: Fail if SCR exists
        if: ${{ hashFiles('**/scr_error.txt') != '' }}
        run: |
          echo "SCR build failed:"
          cat "$GITHUB_WORKSPACE/scr_error.txt"
          exit 1
      - name: Upload Pages Artifact
        # Disabled for now, along with the deploy job below.
        if: false && github.repository == 'partofthething/armi' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: doc/_build/html
      - name: Archive HTML Docs
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: html-docs
          path: doc/_build/html
          retention-days: 5
          include-hidden-files: true

  deploy:
    # Publish to this repo's GitHub Pages site (Settings > Pages > Source: GitHub Actions)
    # Disabled for now; drop the `false &&` here and on "Upload Pages Artifact" to re-enable.
    if: false && github.repository == 'partofthething/armi' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
