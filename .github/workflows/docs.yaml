name: Documentation

# Builds the HTML docs on every push and pull request, and publishes them to this repository's GitHub Pages
# site (https://partofthething.github.io/armi/) from main. HTML only: no test run and no LaTeX/PDF. The test
# report pages are filled with placeholders (doc/skip_str.py); doc/developer/documenting.rst describes the full
# build with real test results.

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # The change log (SCR) pages are built from the git history, and the tutorial includes the example app.
          fetch-depth: 0
          submodules: true
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Setup Graphviz
        uses: ts-graphviz/setup-graphviz@v2.0.2
      - name: Build HTML docs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.ref == 'refs/heads/main' && -1 || github.event.number }}
          GIT_COMMIT: ${{ github.sha }}
        run: |
          set -x
          pip install -U pip
          pip install -e .[memprof,test,docs]
          python doc/skip_str.py
          cd doc
          make html
      - name: Fail if the SCR did not build
        if: ${{ hashFiles('**/scr_error.txt') != '' }}
        run: |
          echo "SCR build failed:"
          cat "$GITHUB_WORKSPACE/scr_error.txt"
          exit 1
      - name: Upload Pages artifact
        if: github.repository == 'partofthething/armi' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: doc/_build/html
      - name: Archive HTML docs
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: html-docs
          path: doc/_build/html
          retention-days: 5
          include-hidden-files: true

  deploy:
    # Settings > Pages > Source must be "GitHub Actions".
    if: github.repository == 'partofthething/armi' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
